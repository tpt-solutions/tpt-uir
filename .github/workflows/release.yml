name: Release

# Hand-rolled release pipeline for tpt-uir-cli binaries and the tpt-uir-ffi
# shared/static libraries. Triggered by pushing a version tag (v0.1.0 etc.).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-cli:
    name: CLI (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tpt-uir-cli-${{ github.ref_name }}-x86_64-linux-gnu
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tpt-uir-cli-${{ github.ref_name }}-aarch64-linux-gnu
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tpt-uir-cli-${{ github.ref_name }}-x86_64-macos
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tpt-uir-cli-${{ github.ref_name }}-aarch64-macos
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: tpt-uir-cli-${{ github.ref_name }}-x86_64-windows
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross-compilation linker (aarch64 linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p tpt-uir-cli
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf "../../../${{ matrix.archive }}.tar.gz" tpt-uir-cli
          cd ../../..
          sha256sum "${{ matrix.archive }}.tar.gz" > "${{ matrix.archive }}.tar.gz.sha256"
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/tpt-uir-cli.exe `
            -DestinationPath "${{ matrix.archive }}.zip"
          $h = (Get-FileHash "${{ matrix.archive }}.zip" -Algorithm SHA256).Hash.ToLower()
          "$h  ${{ matrix.archive }}.zip" | Out-File -Encoding ascii "${{ matrix.archive }}.zip.sha256"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}.*
          if-no-files-found: error

  build-ffi:
    name: FFI (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tpt-uir-ffi-${{ github.ref_name }}-x86_64-linux-gnu
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tpt-uir-ffi-${{ github.ref_name }}-x86_64-macos
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tpt-uir-ffi-${{ github.ref_name }}-aarch64-macos
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: tpt-uir-ffi-${{ github.ref_name }}-x86_64-windows
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build cdylib + staticlib
        run: cargo build --release --target ${{ matrix.target }} -p tpt-uir-ffi
      - name: Stage files (unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p stage/include stage/lib
          cp crates/tpt-uir-ffi/include/tpt_uir_ffi.h stage/include/
          cp target/${{ matrix.target }}/release/libtpt_uir_ffi.so stage/lib/ 2>/dev/null || true
          cp target/${{ matrix.target }}/release/libtpt_uir_ffi.dylib stage/lib/ 2>/dev/null || true
          cp target/${{ matrix.target }}/release/libtpt_uir_ffi.a stage/lib/ 2>/dev/null || true
          tar czf "${{ matrix.archive }}.tar.gz" -C stage .
          sha256sum "${{ matrix.archive }}.tar.gz" > "${{ matrix.archive }}.tar.gz.sha256"
      - name: Stage files (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force stage/include, stage/lib | Out-Null
          Copy-Item crates/tpt-uir-ffi/include/tpt_uir_ffi.h stage/include/
          Copy-Item target/${{ matrix.target }}/release/tpt_uir_ffi.dll stage/lib/ -ErrorAction SilentlyContinue
          Copy-Item target/${{ matrix.target }}/release/tpt_uir_ffi.dll.lib stage/lib/ -ErrorAction SilentlyContinue
          Compress-Archive -Path stage/* -DestinationPath "${{ matrix.archive }}.zip"
          $h = (Get-FileHash "${{ matrix.archive }}.zip" -Algorithm SHA256).Hash.ToLower()
          "$h  ${{ matrix.archive }}.zip" | Out-File -Encoding ascii "${{ matrix.archive }}.zip.sha256"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}.*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub release
    needs: [build-cli, build-ffi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: Create release and attach archives
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
