[package]
name = "tpt-uir-core"
version = "0.1.0"
edition = "2021"
description = "Core data structures for the TPT Unified Intermediate Representation (no_std)"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1.0", optional = true, default-features = false, features = ["derive", "alloc"] }

[features]
default = []
serde = ["dep:serde"]
