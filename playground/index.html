<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>TPT-UIR Playground</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: system-ui, sans-serif; margin: 2rem; background: #14161a; color: #e6e6e6; }
  h1 { font-size: 1.3rem; }
  main { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; max-width: 1200px; }
  textarea { width: 100%; height: 24rem; font-family: ui-monospace, monospace; font-size: 0.85rem;
             background: #1d2025; color: #e6e6e6; border: 1px solid #33373d; border-radius: 6px;
             padding: 0.75rem; box-sizing: border-box; }
  pre { background: #1d2025; border: 1px solid #33373d; border-radius: 6px; padding: 0.75rem;
        min-height: 24rem; white-space: pre-wrap; font-size: 0.85rem; margin: 0; }
  button { background: #3b82f6; border: none; color: white; padding: 0.5rem 1rem;
           border-radius: 6px; cursor: pointer; margin-bottom: 0.5rem; }
  button:disabled { opacity: 0.5; }
  .status { margin-top: 0.4rem; font-size: 0.8rem; }
  .ok { color: #34d399; } .err { color: #f87171; }
</style>
</head>
<body>
<h1>TPT-UIR text playground</h1>
<main>
  <section>
    <button id="run">Format &amp; validate</button>
    <textarea id="input" spellcheck="false"></textarea>
  </section>
  <section>
    <div class="status" id="status"></div>
    <pre id="output"></pre>
  </section>
</main>

<script type="module">
  const DEFAULT = `^bb0(%0: tensor<f32, shape<n:4096>>, %1: tensor<f32, shape<n:4096>>):
  #2: %3 = "core.add"(%0, %1) { grid = shape<blocks:128>, dialect_version = 1 } [
    ^bb0:
      #10: %11 = "tpt_gpu.thread_id"() { axis = 0 }
      #12: "tpt_gpu.barrier"()
  ]
`;

  const input = document.getElementById("input");
  const output = document.getElementById("output");
  const status = document.getElementById("status");
  const run = document.getElementById("run");
  input.value = DEFAULT;

  async function init() {
    try {
      const wasm = await import("./pkg/tpt_uir_wasm.js");
      run.addEventListener("click", () => {
        try {
          const pretty = wasm.format_text(input.value);
          const valid = wasm.validate_text(input.value);
          output.textContent = pretty;
          status.textContent = valid ? "SSA valid" : "SSA INVALID";
          status.className = "status " + (valid ? "ok" : "err");
        } catch (e) {
          output.textContent = "";
          status.textContent = "parse error: " + e;
          status.className = "status err";
        }
      });
      run.disabled = false;
      status.textContent = "ready";
      status.className = "status ok";
    } catch (e) {
      status.textContent =
        'wasm module not found. Build it with: wasm-pack build crates/tpt-uir-wasm --target web --out-dir ../../playground/pkg';
      status.className = "status err";
    }
  }
  init();
</script>
</body>
</html>
